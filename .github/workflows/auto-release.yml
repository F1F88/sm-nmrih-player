name: Auto Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build-plugin:
    name: Build plugin
    uses: ./.github/workflows/build-plugin.yml
    with:
      source_ref: ${{ github.ref }}
    secrets: inherit

  release:
    name: Package and release
    runs-on: ubuntu-latest
    needs:
      - build-plugin

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUTF8=1 python3 <<'PY'
          import zipfile
          from pathlib import Path

          artifacts_dir = Path("artifacts")
          release_dir = Path("release")
          release_dir.mkdir(parents=True, exist_ok=True)

          def zip_dir(source: Path, archive: Path) -> None:
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in sorted(source.rglob("*")):
                      if path.is_file():
                          zf.write(path, path.relative_to(source))

          archives = []

          for item in sorted(p for p in artifacts_dir.glob("*") if p.is_dir()):
              if not item.name.startswith("sm-plugin-nmrih_player-"):
                  print(f"Ignore unrelated artifact: {item.name}")
                  continue

              if not (item / "addons").is_dir():
                  raise SystemExit(f"Artifact {item.name} has no addons/ payload.")

              archive = release_dir / f"{item.name}.zip"
              zip_dir(item, archive)
              archives.append(archive)
              print(f"Created {archive}")

          if not archives:
              raise SystemExit("No sm-plugin-nmrih_player artifacts were found.")
          PY

      - name: Upload packaged artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-artifacts
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*.zip
